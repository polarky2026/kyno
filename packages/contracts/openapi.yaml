openapi: 3.1.0
info:
  title: Kyno API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      tags: [system]
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account and send a verification email
      description: >
        Always responds 202 for valid input, whether or not the email is already
        registered, so the endpoint never reveals which emails have accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "202":
          description: The request was accepted
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address and sign in
      description: >
        Verifying an email signs the user in. Web clients receive the session as
        an HttpOnly cookie. Clients that send X-Kyno-Client: ios receive the
        session token in the body instead.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/KynoClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: The email was verified and the user is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification email
      description: Always responds 202, so the endpoint never reveals which emails have accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: The request was accepted
  /api/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: >
        Web clients receive the session as an HttpOnly cookie. Clients that send
        X-Kyno-Client: ios receive the session token in the body instead.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/KynoClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The email is not verified; a new verification link was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session
      description: Always responds 204, even when there is no session to end.
      tags: [auth]
      responses:
        "204":
          description: The session ended
  /api/me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: There is no valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    KynoClient:
      name: X-Kyno-Client
      in: header
      required: false
      description: Send "ios" to receive the session token in the body instead of a cookie.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          description: A valid email address
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
    SessionToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/SessionToken"
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"