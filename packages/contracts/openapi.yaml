openapi: 3.1.0
info:
  title: Kyno API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      tags: [system]
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account and send a verification email
      description: >
        Always responds 202 for valid input, whether or not the email is already
        registered, so the endpoint never reveals which emails have accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "202":
          description: The request was accepted
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address and sign in
      description: >
        Verifying an email signs the user in. Web clients receive the session as
        an HttpOnly cookie. Clients that send X-Kyno-Client: ios receive the
        session token in the body instead.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/KynoClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: The email was verified and the user is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification email
      description: Always responds 202, so the endpoint never reveals which emails have accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: The request was accepted
  /api/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: >
        Web clients receive the session as an HttpOnly cookie. Clients that send
        X-Kyno-Client: ios receive the session token in the body instead.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/KynoClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The email is not verified; a new verification link was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session
      description: Always responds 204, even when there is no session to end.
      tags: [auth]
      responses:
        "204":
          description: The session ended
  /api/me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: There is no valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/titles/search:
    get:
      operationId: searchTitles
      summary: Search movies and series in the external catalog
      description: >
        Searches TMDB. Results are not stored; a title enters Kyno's catalog
        only when it is opened or rated.
      tags: [titles]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: kind
          in: query
          required: false
          description: Search only movies or only series. Omit it to search both.
          schema:
            $ref: "#/components/schemas/TitleKind"
      responses:
        "200":
          description: The matching titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleSearchResponse"
        "400":
          description: The query or kind is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: There is no valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The external catalog is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/titles:
    post:
      operationId: importTitle
      summary: Add a title to the catalog, or refresh it
      description: >
        Brings a title from TMDB into Kyno's catalog the first time it is
        opened, and refreshes it when the stored copy is more than a day old.
        Calling it again for the same title never duplicates it. It doesn't add
        the title to anyone's library.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportTitleRequest"
      responses:
        "200":
          description: The title as stored in the catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Title"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: There is no valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TMDB has no such title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The external catalog is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/titles/{id}:
    get:
      operationId: getTitle
      summary: Get a title from the catalog
      tags: [titles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Title"
        "400":
          description: The id is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: There is no valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The title isn't in the catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    KynoClient:
      name: X-Kyno-Client
      in: header
      required: false
      description: Send "ios" to receive the session token in the body instead of a cookie.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          description: A valid email address
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
    SessionToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/SessionToken"
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    TitleKind:
      type: string
      enum: [movie, series]
    TitleSearchResult:
      type: object
      required: [tmdbId, kind, title, originalTitle, overview]
      properties:
        tmdbId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TitleKind"
        title:
          type: string
        originalTitle:
          type: string
        overview:
          type: string
        posterPath:
          type: string
          description: TMDB image path. Build the URL as https://image.tmdb.org/t/p/{size}{posterPath}.
        year:
          type: integer
          description: Release year for movies, first air year for series. Missing when unknown.
    TitleSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TitleSearchResult"
    ImportTitleRequest:
      type: object
      required: [kind, tmdbId]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdbId:
          type: integer
          format: int64
          minimum: 1
    Title:
      type: object
      required: [id, kind, tmdbId, title, originalTitle, overview, seasons]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdbId:
          type: integer
          format: int64
        title:
          type: string
        originalTitle:
          type: string
        overview:
          type: string
        posterPath:
          type: string
          description: TMDB image path. Build the URL as https://image.tmdb.org/t/p/{size}{posterPath}.
        releaseDate:
          type: string
          format: date
          description: Release date for movies, first air date for series. Missing when unknown.
        libraryYear:
          type: integer
          description: >
            The year the title is grouped under in the library: a movie's release
            year, or the year of a series' latest aired season. Missing when
            unknown, which groups the title under "No year".
        seasons:
          type: array
          description: The seasons of a series, without specials. Always empty for movies.
          items:
            $ref: "#/components/schemas/Season"
    Season:
      type: object
      required: [number, name, episodeCount, aired]
      properties:
        number:
          type: integer
          minimum: 1
        name:
          type: string
        airDate:
          type: string
          format: date
        episodeCount:
          type: integer
        aired:
          type: boolean
          description: Whether the season has started airing.
